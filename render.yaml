# Deploy ke Render: New > Blueprint > pilih repo ini
databases:
  - name: gelar-db
    plan: free
    databaseName: gelar
    user: gelar

services:
  - type: web
    name: gelar-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: gelar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        fromService:
          type: web
          name: gelar-web
          property: host

  - type: web
    name: gelar-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        fromService:
          type: web
          name: gelar-api
          property: host
